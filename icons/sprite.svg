<!-- Self-hosted subset of Lucide icons (ISC license), lucide-static v1.35.0,
     matching the exact version this app was previously loading from the
     unpkg CDN. Contains only the icon names this app actually references
     (grepped for data-lucide="...", icon("..."), and iconAvatar("...")
     across src/, plus CATEGORY_ICON and GOAL_ICONS in categories.js), not
     the whole Lucide set. Referenced via same-origin
     use href="./icons/sprite.svg#name", cached by the service worker like
     any other static asset; this is what actually fixes offline use,
     since the CDN script was never reachable at all until a first
     successful online load, and sw.js deliberately never caches
     cross-origin requests.
     NOTE: this is a real XML document, not just HTML markup, so a comment
     body must never contain two hyphens in a row anywhere, not even when
     describing that very rule in prose (an earlier draft of this note
     broke itself exactly that way, by spelling out its own closing
     sequence as literal text). Getting this wrong fails the whole file to
     parse, silently, and every icon on the page stops rendering with no
     console error at all.
     To add or update an icon: fetch its raw SVG from lucide-static on
     unpkg (see the ISC license notice above for the exact version this
     was pulled from), copy its inner path/etc. children into a new or
     updated symbol id="name" viewBox="..." block below, matching the same
     stroke attributes lucide's own icons use, namely fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round", unless that specific icon's source declares
     something different. -->
