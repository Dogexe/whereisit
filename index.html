<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายรับ-รายจ่าย</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#6247ea" id="themeColorMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <main class="screen" id="screen"></main>

  <div class="toast" id="toast" hidden></div>

  <div class="tabbar-wrap">
    <nav class="tabbar" id="tabbar">
      <button type="button" data-tab="home">
        <i class="icon" data-lucide="layout-grid"></i>
        <span data-l="tabHome"></span>
      </button>
      <button type="button" data-tab="transactions">
        <i class="icon" data-lucide="list"></i>
        <span data-l="tabTx"></span>
      </button>
      <button type="button" data-tab="add">
        <i class="icon" data-lucide="plus-circle"></i>
        <span data-l="tabAdd"></span>
      </button>
      <button type="button" data-tab="insights">
        <i class="icon" data-lucide="pie-chart"></i>
        <span data-l="tabInsights"></span>
      </button>
      <button type="button" data-tab="settings">
        <i class="icon" data-lucide="settings"></i>
        <span data-l="tabSettings"></span>
      </button>
    </nav>
  </div>

</div>

<script type="module" src="./main.js"></script>
</body>
</html>
