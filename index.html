<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: required for env(safe-area-inset-bottom) in
     styles.css to resolve to an actual value rather than 0 -- without it
     the fixed tab bar's bottom padding and .screen/.toast's matching
     offsets have nothing to react to on a notched/gesture-nav phone,
     particularly once installed standalone (manifest.json's
     display:"standalone"), which draws edge-to-edge under the safe area. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>whereisit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#f6f6f8" id="themeColorMeta">
<!-- Font is self-hosted (fonts/*.woff2, @font-face in styles.css), not
     loaded from Google Fonts -- sw.js never caches cross-origin requests,
     so a CDN font never loads offline before its first successful online
     fetch. See styles.css's @font-face comment for why this is two
     families (Inter has no Thai glyphs at all), not one. -->
<!-- Pinned to exact versions with Subresource Integrity: an unpinned
     @2 / @latest CDN URL means a breaking upstream release changes the
     live app with no change on our side and no version to roll back to.
     Bump the version, re-fetch the file, and recompute the sha384 hash
     (e.g. `curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A`)
     together whenever these are intentionally upgraded. supabase-js stays
     on the CDN, not bundled -- syncing can't work offline anyway, so
     there's nothing to gain from self-hosting it the way the font and
     icons were (those affect whether the UI itself renders offline). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>
<!-- Lucide is no longer CDN-loaded at all (it used to be pinned+SRI'd
     here) -- icons are self-hosted as an inline <use> sprite instead (see
     icons/sprite.svg and utils.js's icon()), which is what actually makes
     them render offline, not just pinned against a breaking release. -->
<!-- Google Identity Services is loaded on demand from src/sheets-export.js
     (only the Google Sheets export flow needs it), not here -- it has no
     versioned CDN URL to pin, so it stays off the critical path instead. -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <!-- Desktop-only (>=1024px, see styles.css) persistent left nav; hidden
       below that breakpoint where .tabbar-wrap is used instead. Buttons
       share the .nav-btn class with #tabbar's so router.js/main.js wire
       both identically without duplicating click/active-state logic. -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg class="sidebar-logo" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring" cx="28" cy="28" r="19"/>
        <line class="handle" x1="42" y1="42" x2="52" y2="52"/>
        <circle class="dot" cx="28" cy="28" r="7"/>
      </svg>
      <span class="sidebar-title" data-l="appTitle"></span>
    </div>
    <button type="button" class="nav-btn" data-tab="home">
      <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#home"></use></svg>
      <span data-l="tabHome"></span>
    </button>
    <button type="button" class="nav-btn" data-tab="transactions">
      <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#list"></use></svg>
      <span data-l="tabTx"></span>
    </button>
    <button type="button" class="nav-btn" data-tab="add">
      <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#plus-circle"></use></svg>
      <span data-l="tabAdd"></span>
    </button>
    <button type="button" class="nav-btn" data-tab="insights">
      <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#pie-chart"></use></svg>
      <span data-l="tabInsights"></span>
    </button>
    <button type="button" class="nav-btn" data-tab="settings">
      <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#settings"></use></svg>
      <span data-l="tabSettings"></span>
    </button>
    <!-- Account status only (not a nav target -- Settings' own profile row
         already owns sign-in/sign-out); text is filled in by
         screens/router.js's renderChrome(), which already re-runs on every
         auth-state change, language switch, and navigation. -->
    <div class="sidebar-footer">
      <span class="sidebar-account-avatar">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#user"></use></svg>
      </span>
      <span class="sidebar-account-name" id="sidebarAccountName"></span>
    </div>
  </nav>

  <main class="screen" id="screen"></main>

  <div class="toast" id="toast" hidden></div>

  <!-- Mobile-only Add/Edit bottom sheet (docs/specs/
       add-transaction-bottom-sheet.md). Not owned by any one screen --
       populated by screens/add.js's renderAddSheet(), independent of
       #screen's per-tab full-replace renders, so it can be opened from
       Home/Transactions/Insights/Settings alike. Empty until opened. -->
  <div id="addSheetContainer"></div>

  <!-- Mobile-only Manage-section (Budgets/Bills/Goals/Categories/Accounts)
       add/edit bottom sheet (docs/specs/settings-manage-swipe-and-sheet.md).
       Same reasoning as #addSheetContainer above: renderSettings() fully
       replaces $("screen").innerHTML on every re-render (an accordion
       toggle, a language switch, a sync pull), so a sheet living inside
       that output would get wiped by the next unrelated re-render. Only
       ever populated by screens/settings.js's renderManageSheet(). Empty
       until opened. -->
  <div id="manageSheetContainer"></div>

  <!-- docs/specs/app-lock.md. Same reasoning as #addSheetContainer/
       #manageSheetContainer above -- not owned by any one screen (it can
       cover any tab), so it lives outside #screen's per-tab full-replace
       renders and survives them untouched. Populated by applock.js. Empty
       until a PIN gate is actually showing. -->
  <div id="appLockContainer"></div>

  <div class="tabbar-wrap">
    <nav class="tabbar" id="tabbar">
      <button type="button" class="nav-btn" data-tab="home" data-l-aria="tabHome">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#home"></use></svg>
      </button>
      <button type="button" class="nav-btn" data-tab="transactions" data-l-aria="tabTx">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#list"></use></svg>
      </button>
      <button type="button" class="nav-btn" data-tab="add" data-l-aria="tabAdd">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#plus"></use></svg>
      </button>
      <button type="button" class="nav-btn" data-tab="insights" data-l-aria="tabInsights">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#pie-chart"></use></svg>
      </button>
      <button type="button" class="nav-btn" data-tab="settings" data-l-aria="tabSettings">
        <svg class="icon" aria-hidden="true"><use href="./icons/sprite.svg#settings"></use></svg>
      </button>
    </nav>
  </div>

</div>

<script type="module" src="./main.js"></script>
</body>
</html>
