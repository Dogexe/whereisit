<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายรับ-รายจ่าย</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#6247ea" id="themeColorMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Pinned to exact versions with Subresource Integrity: an unpinned
     @2 / @latest CDN URL means a breaking upstream release changes the
     live app with no change on our side and no version to roll back to.
     Bump the version, re-fetch the file, and recompute the sha384 hash
     (e.g. `curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A`)
     together whenever these are intentionally upgraded. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@1.35.0/dist/umd/lucide.min.js" integrity="sha384-eZXpDHN86IMQuxntjYbYprDla50QW8NC+8P9nUywt9PSVNqZE2Ri3YZ2WWKoliDw" crossorigin="anonymous"></script>
<!-- Google Identity Services is loaded on demand from src/sheets-export.js
     (only the Google Sheets export flow needs it), not here -- it has no
     versioned CDN URL to pin, so it stays off the critical path instead. -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <main class="screen" id="screen"></main>

  <div class="toast" id="toast" hidden></div>

  <div class="tabbar-wrap">
    <nav class="tabbar" id="tabbar">
      <button type="button" data-tab="home">
        <i class="icon" data-lucide="layout-grid"></i>
        <span data-l="tabHome"></span>
      </button>
      <button type="button" data-tab="transactions">
        <i class="icon" data-lucide="list"></i>
        <span data-l="tabTx"></span>
      </button>
      <button type="button" data-tab="add">
        <i class="icon" data-lucide="plus-circle"></i>
        <span data-l="tabAdd"></span>
      </button>
      <button type="button" data-tab="insights">
        <i class="icon" data-lucide="pie-chart"></i>
        <span data-l="tabInsights"></span>
      </button>
      <button type="button" data-tab="settings">
        <i class="icon" data-lucide="settings"></i>
        <span data-l="tabSettings"></span>
      </button>
    </nav>
  </div>

</div>

<script type="module" src="./main.js"></script>
</body>
</html>
